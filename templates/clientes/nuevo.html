{% extends "base.html" %}
{% block title %}Nuevo Cliente{% endblock %}
{% block content %}

<h4 class="mb-3"><i class="bi bi-person-plus me-2" style="color:var(--ocaso-blue)"></i>Nuevo Cliente</h4>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <!-- Zona arrastrar DNI -->
                <div id="dniDropZone" class="border border-2 border-dashed rounded p-3 text-center mb-3" style="border-color: var(--border-subtle) !important; background: var(--surface-soft);">
                    <i class="bi bi-person-vcard fs-3 text-muted"></i>
                    <p class="mb-1 small text-muted">Arrastra el DNI aquí (PDF, JPG) para rellenar automáticamente</p>
                    <small class="text-muted">o usa el formulario manual</small>
                    <div id="dniOcrStatus" class="small mt-2"></div>
                </div>
                <form method="POST" enctype="multipart/form-data" id="nuevoClienteForm">
                    <input type="file" name="dni_file" id="dniFileInput" accept=".pdf,.jpg,.jpeg,.png,.webp,.bmp,.tiff,.tif" style="display:none">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre completo *</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI/NIF *</label>
                            <input type="text" name="dni" class="form-control">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Direccion</label>
                            <input type="text" name="direccion" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Codigo Postal</label>
                            <input type="text" name="codigo_postal" id="cpInput" list="cp-datalist" class="form-control" 
                                   maxlength="5" autocomplete="off" placeholder="Buscar CP..."
                                   onchange="autoFillFromCP()" oninput="autoFillFromCP()">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Poblacion</label>
                            <input type="text" name="poblacion" id="poblacionInput" list="poblacion-datalist" class="form-control" 
                                   autocomplete="off" placeholder="Buscar poblacion..."
                                   onchange="autoFillFromPoblacion()" oninput="autoFillFromPoblacion()">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Provincia</label>
                            <input type="text" name="provincia" id="provinciaInput" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" name="fecha_nacimiento" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger mt-3" style="background:var(--ocaso-blue)">
                        <i class="bi bi-check-lg me-1"></i> Crear Cliente
                    </button>
                    <a href="{{ url_for('clientes.index') }}" class="btn btn-outline-secondary mt-3 ms-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

<datalist id="cp-datalist"></datalist>
<datalist id="poblacion-datalist"></datalist>

<script src="{{ url_for('static', filename='js/codigos_postales.js') }}"></script>
<script>
(function(){
    var cpDl = document.getElementById('cp-datalist');
    var pobDl = document.getElementById('poblacion-datalist');
    var addedCPs = new Set();
    var addedPobs = new Set();
    
    CODIGOS_POSTALES.forEach(function(item) {
        if (!addedCPs.has(item.cp)) {
            addedCPs.add(item.cp);
            var opt = document.createElement('option');
            opt.value = item.cp;
            opt.textContent = item.cp + ' - ' + item.poblacion + ' (' + item.provincia + ')';
            cpDl.appendChild(opt);
        }
        if (!addedPobs.has(item.poblacion)) {
            addedPobs.add(item.poblacion);
            var opt2 = document.createElement('option');
            opt2.value = item.poblacion;
            opt2.textContent = item.poblacion + ' (' + item.provincia + ')';
            pobDl.appendChild(opt2);
        }
    });

    window.autoFillFromCP = function() {
        var cp = document.getElementById('cpInput').value.trim();
        var found = CODIGOS_POSTALES.find(function(item) { return item.cp === cp; });
        if (found) {
            document.getElementById('poblacionInput').value = found.poblacion;
            document.getElementById('provinciaInput').value = found.provincia;
        }
    };

    window.autoFillFromPoblacion = function() {
        var pob = document.getElementById('poblacionInput').value.trim();
        var found = CODIGOS_POSTALES.find(function(item) { return item.poblacion === pob; });
        if (found) {
            document.getElementById('cpInput').value = found.cp;
            document.getElementById('provinciaInput').value = found.provincia;
        }
    };
})();

// --- DNI OCR arrastrar ---
(function(){
    const zone = document.getElementById('dniDropZone');
    const fileInput = document.getElementById('dniFileInput');
    const status = document.getElementById('dniOcrStatus');
    const form = document.getElementById('nuevoClienteForm');
    let pendingFile = null;

    function setStatus(msg, cls) {
        if (!status) return;
        status.textContent = msg;
        status.className = 'small mt-2 ' + (cls || 'text-muted');
    }

    function fillForm(data) {
        if (!data) return;
        const map = {
            'nombre': 'input[name=\"nombre\"]',
            'dni': 'input[name=\"dni\"]',
            'direccion': 'input[name=\"direccion\"]',
            'codigo_postal': '#cpInput',
            'poblacion': '#poblacionInput',
            'provincia': '#provinciaInput',
            'fecha_nacimiento': 'input[name=\"fecha_nacimiento\"]'
        };
        Object.keys(map).forEach(k => {
            if (data[k]) {
                const el = document.querySelector(map[k]);
                if (el) {
                    el.value = data[k];
                    el.dispatchEvent(new Event('input', {bubbles:true}));
                    el.dispatchEvent(new Event('change', {bubbles:true}));
                }
            }
        });
        // Si hay CP, disparar autocompletado
        if (data.codigo_postal) autoFillFromCP();
        if (data.poblacion) autoFillFromPoblacion();
    }

    async function handleFile(file) {
        if (!file) return;
        const isPdfOrImg = file.type === 'application/pdf' || file.type.startsWith('image/') || /\.(pdf|jpe?g|png|webp|bmp|tiff?)$/i.test(file.name);
        if (!isPdfOrImg) {
            setStatus('Formato no soportado. Usa PDF o imagen del DNI.', 'text-danger');
            return;
        }
        // Guardar para el submit final
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        pendingFile = file;

        setStatus('Leyendo DNI con OCR...', 'text-muted');
        zone.classList.add('border-primary');

        const fd = new FormData();
        fd.append('documento', file);
        try {
            const resp = await fetch('{{ url_for('clientes.ocr_dni') }}', { method: 'POST', body: fd });
            const j = await resp.json();
            if (!resp.ok) throw new Error(j.error || 'Error OCR');
            fillForm(j.data || {});
            const n = Object.keys(j.data || {}).length;
            if (n > 0) {
                setStatus('Datos extraídos (' + n + ' campos). Revisa y pulsa Crear Cliente. El DNI se guardará en Documentación.', 'text-success');
            } else {
                setStatus('No se pudo extraer datos automáticamente. Rellena manualmente. El DNI se guardará igualmente.', 'text-warning');
            }
            // Mostrar texto OCR para depuración si hay
            if (j.text) console.log('OCR text:', j.text.substring(0, 500));
        } catch (e) {
            setStatus('Error OCR: ' + e.message + '. Rellena manualmente.', 'text-danger');
        } finally {
            zone.classList.remove('border-primary');
        }
    }

    if (zone) {
        ['dragenter', 'dragover'].forEach(ev => {
            zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); zone.classList.add('border-primary', 'bg-light'); });
        });
        ['dragleave', 'drop'].forEach(ev => {
            zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); zone.classList.remove('border-primary', 'bg-light'); });
        });
        zone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length) handleFile(files[0]);
        });
        zone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });
    }
})();
</script>

{% endblock %}
