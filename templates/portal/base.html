<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1739">
    <title>{% block title %}Portal de clientes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/portal.css') }}" rel="stylesheet">
    {% if tenant_config.get('branding', {}).get('primary_color') %}
    <style>:root { --portal-primary: {{ tenant_config.get('branding', {}).get('primary_color') }}; }</style>
    {% endif %}
</head>
<body>
<nav class="portal-nav navbar navbar-expand">
    <div class="container portal-nav-inner">
        <a class="portal-brand" href="{{ url_for('portal.dashboard') }}">
            <span class="portal-brand-mark">A</span>
            <span><strong>{{ tenant_config.get('branding', {}).get('name', 'AGENTES ÉLITE') }}</strong><small>Portal de clientes</small></span>
        </a>
        <div class="portal-links">
            <a href="{{ url_for('portal.dashboard') }}" class="nav-link"><i class="bi bi-grid"></i><span>Inicio</span></a>
            <a href="{{ url_for('portal.polizas') }}" class="nav-link"><i class="bi bi-file-earmark-check"></i><span>Pólizas</span></a>
            <a href="{{ url_for('portal.siniestros') }}" class="nav-link"><i class="bi bi-shield-exclamation"></i><span>Siniestros</span></a>
            <a href="{{ url_for('portal.recibos') }}" class="nav-link"><i class="bi bi-receipt"></i><span>Recibos</span></a>
            <a href="{{ url_for('portal.documentos') }}" class="nav-link"><i class="bi bi-folder2-open"></i><span>Documentos</span></a>
            <a href="{{ url_for('portal.logout') }}" class="nav-link portal-logout" title="Salir"><i class="bi bi-box-arrow-right"></i><span>Salir</span></a>
        </div>
    </div>
</nav>
<main class="container portal-main">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
