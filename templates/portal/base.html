<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal Ocaso{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --portal-blue: #1a5276; --portal-blue-light: #2980b9; }
        body { background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .portal-nav { background: linear-gradient(135deg, var(--portal-blue), var(--portal-blue-light)); }
        .portal-nav .nav-link { color: rgba(255,255,255,0.8); font-weight: 500; }
        .portal-nav .nav-link:hover, .portal-nav .nav-link.active { color: white; }
        .portal-card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: none; }
        .portal-card .card-header { background: white; border-bottom: 1px solid #eee; font-weight: 600; }
        .badge-abierto { background: #e74c3c; color: white; }
        .badge-tramite { background: #f39c12; color: white; }
        .badge-resuelto { background: #27ae60; color: white; }
        .badge-cerrado { background: #95a5a6; color: white; }
    </style>
</head>
<body>
<nav class="portal-nav navbar navbar-dark px-3 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{{ url_for('portal.dashboard') }}">OCASO Clientes</a>
        <div class="d-flex gap-2">
            <a href="{{ url_for('portal.dashboard') }}" class="nav-link d-none d-sm-inline">Inicio</a>
            <a href="{{ url_for('portal.polizas') }}" class="nav-link d-none d-sm-inline">Polizas</a>
            <a href="{{ url_for('portal.siniestros') }}" class="nav-link d-none d-sm-inline">Siniestros</a>
            <a href="{{ url_for('portal.recibos') }}" class="nav-link d-none d-sm-inline">Recibos</a>
            <a href="{{ url_for('portal.documentos') }}" class="nav-link d-none d-sm-inline">Documentos</a>
            <a href="{{ url_for('portal.logout') }}" class="nav-link"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>
<div class="container py-3">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
